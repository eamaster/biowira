name: Deploy to AWS

on:
  push:
    branches: [master, iteration1, iteration2, iteration3]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ── Derive S3 prefix & Vite base from the branch name ──────────────
      # master uploads to s3://bucket/current/ (CF function maps / → current/)
      # iteration branches upload to s3://bucket/iterationN/
      - name: Set deploy path
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [ "$BRANCH" = "master" ]; then
            echo "DEPLOY_PREFIX=current/" >> "$GITHUB_ENV"
            echo "VITE_BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "DEPLOY_PREFIX=${BRANCH}/" >> "$GITHUB_ENV"
            echo "VITE_BASE_PATH=/${BRANCH}/" >> "$GITHUB_ENV"
          fi

      - name: Install & build
        run: |
          npm ci
          npm run build
        env:
          VITE_BASE_PATH: ${{ env.VITE_BASE_PATH }}
          VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}
          # All backend endpoints live under /api/v1/ per the Swagger contract.
          # The fallback must be '/api/v1' — using '/api' causes 404s in production.
          # Override by setting the VITE_API_BASE_URL GitHub Actions variable if needed.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '/api/v1' }}
          VITE_USE_MOCK: 'false'
          VITE_APP_VERSION: ${{ vars.VITE_APP_VERSION || '0.1.0' }}
          VITE_SESSION_ENABLED: ${{ vars.VITE_SESSION_ENABLED || 'true' }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-5

      # master      → s3://bucket/current/
      # iteration1  → s3://bucket/iteration1/
      # iteration2  → s3://bucket/iteration2/
      # iteration3  → s3://bucket/iteration3/
      - name: S3 Sync
        run: |
          aws s3 sync dist/ "s3://${{ secrets.AWS_S3_BUCKET }}/${{ env.DEPLOY_PREFIX }}" --delete

      - name: Invalidate CloudFront
        uses: chetan/invalidate-cloudfront-action@v1.3
        env:
          DISTRIBUTION: ${{ secrets.DISTRIBUTION }}
          PATHS: '/${{ env.DEPLOY_PREFIX }}*'
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-southeast-5

