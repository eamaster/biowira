name: CI & Cloudflare Deployment

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  build-frontend:
    name: Build & Verify Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit & integration tests
        run: npm test

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_WEATHER_API_BASE_URL: https://api.open-meteo.com/v1
          VITE_USE_MOCK: 'false'
          VITE_APP_VERSION: 1.0.0
          VITE_SESSION_ENABLED: 'true'
          VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.VITE_MAPBOX_ACCESS_TOKEN || vars.VITE_MAPBOX_ACCESS_TOKEN }}

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && github.ref == 'refs/heads/master'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 767ce92674d0bd477eef696c995faf16
          command: pages deploy dist --project-name=biowira --branch=master --commit-dirty=true

  build-worker:
    name: Build & Verify Worker API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci || npm install

      - name: Type-check Worker
        working-directory: worker
        run: npx tsc --noEmit

      - name: Deploy Worker to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != '' && github.ref == 'refs/heads/master'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 767ce92674d0bd477eef696c995faf16
          workingDirectory: worker
          command: deploy
