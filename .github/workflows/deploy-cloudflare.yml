name: Deploy to Cloudflare

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-deploy-frontend:
    name: Build & Deploy Frontend (Pages)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_WEATHER_API_BASE_URL: https://api.open-meteo.com/v1
          VITE_USE_MOCK: 'false'
          VITE_APP_VERSION: 1.0.0
          VITE_SESSION_ENABLED: 'true'

      - name: Deploy to Cloudflare Pages
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && github.ref == 'refs/heads/master' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 767ce92674d0bd477eef696c995faf16
          command: pages deploy dist --project-name=biowira --branch=master --commit-dirty=true

      - name: Cloudflare Pages Notice
        if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "ℹ️ CLOUDFLARE_API_TOKEN secret is not set in GitHub repository secrets."
          echo "Frontend build succeeded. Set CLOUDFLARE_API_TOKEN in GitHub secrets or use Cloudflare Pages Git Integration for automated edge deployments."

  build-and-deploy-worker:
    name: Build & Deploy Serverless API (Worker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci || npm install

      - name: Type-check Worker
        working-directory: worker
        run: npx tsc --noEmit

      - name: Deploy Worker to Cloudflare
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && github.ref == 'refs/heads/master' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 767ce92674d0bd477eef696c995faf16
          workingDirectory: worker
          command: deploy

      - name: Cloudflare Worker Notice
        if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "ℹ️ CLOUDFLARE_API_TOKEN secret is not set in GitHub repository secrets."
          echo "Worker type-check passed. The worker is already deployed and live at https://biowira-api.smah0085.workers.dev."
